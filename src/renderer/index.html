<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kimi Desktop</title>
    <!--
      CSP for kimi.ai webview + Kimi Code API:
      - kimi.ai / *.kimi.ai for the web app
      - api.kimi.com reachable only via the main-process proxy (connect-src kept for resilience)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https://kimi.ai https://*.kimi.ai https://kimi.com https://*.kimi.com; script-src 'self' 'unsafe-inline' https://kimi.ai https://*.kimi.ai https://kimi.com https://*.kimi.com; style-src 'self' 'unsafe-inline' https://kimi.ai https://*.kimi.ai https://kimi.com https://*.kimi.com; img-src 'self' data: blob: https:; connect-src 'self' https://kimi.ai https://*.kimi.ai wss://*.kimi.ai https://kimi.com https://*.kimi.com wss://*.kimi.com https://api.kimi.com; font-src 'self' https://kimi.ai https://*.kimi.ai https://kimi.com https://*.kimi.com; frame-src 'self' https://kimi.ai https://kimi.com;"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
