name: Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # ── Checkout & Setup ───────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Linux Dependencies ─────────────────────────────────────────────────
      - name: Install Snapcraft (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo snap install snapcraft --classic
          echo "/snap/bin" >> $GITHUB_PATH

      # ── Windows Code Signing Setup ──────────────────────────────────────────
      - name: Setup Windows Certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > cert.pfx
          echo "CSC_LINK=cert.pfx" >> $GITHUB_ENV
        shell: bash

      # ── Build & Release ─────────────────────────────────────────────────────
      - name: Build Application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run release

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Cleanup Windows Certificate
        if: matrix.os == 'windows-latest' && always()
        run: rm -f cert.pfx
        shell: bash

      # ── Upload Artifacts ────────────────────────────────────────────────────
      - name: Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.rpm
            dist/*.snap
            dist/*.AppImage
          retention-days: 5

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 5